- id: conference
  label: "Conference Paper"
  hint: "a peer-reviewed conference paper (typical length: 8-12 pages). Include: Abstract, Introduction, Related Work, Methodology, Experiments/Evaluation, Discussion, Conclusion, References."

- id: workshop
  label: "Workshop Paper"
  hint: "a peer-reviewed workshop paper (typical length: 4-6 pages). Include: Abstract, Introduction, Related Work, Method, Preliminary Results, Discussion, Conclusion, References. Workshop papers emphasize novelty and ongoing work over completeness."

- id: journal
  label: "Journal Article"
  hint: "a full journal article (typical length: 15-25 pages). Include: Abstract, Introduction, Background, Methodology, Results, Discussion, Conclusion, References. Journal papers require more thorough related work and deeper analysis than conference papers."

- id: technical_report
  label: "Technical Report"
  hint: "a technical report (no page limit). Include: Executive Summary, Introduction, Background and Related Work, System Design, Implementation, Evaluation, Discussion, Conclusion, References."

- id: white_paper
  label: "White Paper"
  hint: "an industry white paper for a non-academic audience. Include: Executive Summary, Problem Statement, Solution Overview, Technical Approach, Evidence and Results, Call to Action, References. Avoid jargon. Lead with value, not with methodology."

- id: extended_abstract
  label: "Extended Abstract"
  hint: "an extended abstract for a conference (typical length: 2-4 pages). Include: Abstract (1 paragraph), Introduction & Motivation, Approach (concise), Preliminary Results, Future Work, References. Be terse — every sentence earns its place."

- id: grant_proposal
  label: "Grant Proposal"
  hint: "a research grant proposal (typical length: 12-15 pages, follows NIH/NSF format). Include: Project Summary / Specific Aims (1 page), Significance, Innovation, Approach (with timeline), Preliminary Data, Broader Impacts, References. Frame everything around what will be DONE in the project, not what has been done. Aims should be testable, time-bound, and independent of each other."

- id: phd_proposal
  label: "PhD Proposal"
  hint: "a PhD thesis proposal (typical length: 20-40 pages). Include: Abstract, Motivation, Research Questions, Background and Related Work, Preliminary Work, Proposed Research (3-4 chapters / aims), Timeline, Expected Contributions, References. Frame as a research plan: what's done, what's proposed, why each piece matters."

- id: book_chapter
  label: "Book Chapter"
  hint: "a book chapter aimed at a graduate-level audience (typical length: 20-30 pages). Include: Introduction, Background, Core Concepts (multiple subsections), Worked Examples, Open Problems, Summary, References. Tutorial in tone — the reader is learning the topic for the first time."
