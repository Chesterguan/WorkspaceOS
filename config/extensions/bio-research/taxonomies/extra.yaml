name: bio_research_extra
node_types:
  - id: strain
    label: Strain
    color: "#10b981"
    description: An engineered strain — genotype, parent line, intended phenotype

  - id: construct
    label: Construct
    color: "#3b82f6"
    description: A DNA / RNA construct — design intent, sequence reference, version

  - id: assay
    label: Assay
    color: "#06b6d4"
    description: An experimental assay — protocol, readout, calibration source

  - id: experiment
    label: Experiment
    color: "#f97316"
    description: A run with hypothesis, conditions, result, and replicate count

  - id: interview
    label: Interview
    color: "#14b8a6"
    description: A conversation with a customer / collaborator / partner that surfaced signal

  - id: protocol
    label: Protocol
    color: "#06b6d4"
    description: An OT-2 (or similar) automation protocol — labware layout, instrument setup, and source code

  - id: tool
    label: Tool
    color: "#a78bfa"
    description: A software tool or GitHub repository — language, stars, and README excerpt
