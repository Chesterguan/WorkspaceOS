id: benchling
name: Benchling Sync
description: |
  Read-only sync of recent Benchling data into the knowledge graph.
  Choose what to pull via `entity_types`:
    - "entries"          → notebook entries → benchling_entry nodes
    - "dna_sequences"    → plasmids/inserts → construct nodes (v0.2.6)
    - "custom_entities"  → strains etc.    → strain nodes  (v0.2.6,
                                              requires schema filter)
  Body content stays in Benchling — this is a pointer-into-your-ELN,
  not a mirror.
version: 0.2.0
author: workspaceos

matches:
  domain_keywords: []   # opt-in only — user enables via Settings

capabilities:
  - kind: ingest_source
    name: benchling_import
    description: |
      Pulls recently-modified data from your Benchling tenant. The
      `entity_types` list controls what gets pulled. Default keeps the
      pre-v0.2.6 behavior (notebook entries only); add "dna_sequences"
      to also catalogue your plasmid registry as construct nodes, and
      "custom_entities" + a `custom_entity_schemas` filter to pull
      strains or other schema-driven entities. To enable: set api_key
      + tenant below (or in Settings).
    config:
      # Required — get from Benchling Settings → API Keys.
      api_key: ""
      # Required — your tenant subdomain (e.g. "mylab.benchling.com").
      tenant: ""
      # What to pull. Subset of:
      #   "entries", "dna_sequences", "custom_entities"
      # Default keeps backward-compat: notebook entries only.
      entity_types:
        - entries
      # Schema-name substrings (case-insensitive) to include when
      # "custom_entities" is in entity_types. Empty = skip custom
      # entities even if listed in entity_types — without a schema
      # filter we'd mix incompatible registry shapes into one node
      # type. Examples: ["strain"], ["plant_line", "bacterium"].
      custom_entity_schemas: []
      # How far back to look on each tick (applied to modifiedAt).
      days_back: 14
      page_size: 50
      poll_interval_seconds: 21600     # 6 hours
